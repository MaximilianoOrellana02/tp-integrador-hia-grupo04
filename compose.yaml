name: maxflix

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta en .env}
    volumes:
      - datos:/var/lib/postgresql/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRETO: ${JWT_SECRETO:?Falta en .env}
      JWT_EXPIRACION: 1d
      TMDB_TOKEN: ${TMDB_TOKEN:?Falta en .env}
      ADDONS_CLAVE: ${ADDONS_CLAVE:?Falta en .env}
      REGISTRO_HABILITADO: ${REGISTRO_HABILITADO:-true}
      PROXIES_CONFIABLES: 1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - interna

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - interna

volumes:
  datos:

networks:
  interna:
